name: Build Android ARM64 mGBA Core

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Android NDK
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/25.2.9519653" >> $GITHUB_ENV

      - name: Cross-Compile mGBA Core for ARM64
        run: |
          make -f Makefile.libretro platform=android-arm64-v8a NDK_ROOT=${ANDROID_NDK_HOME}

      - name: Upload Android ARM64 Core
        uses: actions/upload-artifact@v4
        with:
          name: mgba_libretro_android_arm64
          path: mgba_libretro.so
